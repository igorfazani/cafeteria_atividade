<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contato | Café & Código</title>
    <link rel="stylesheet" href="css/contato.css">
</head>
<body>


    <header>
        <h1>Café & Código</h1>
        <p>Uma pausa gostosa entre um projeto e outro.</p>
    </header>


    <nav class="menu">
        <a href="index.html">Início</a>
        <a href="cardapio.html">Cardápio</a>
        <a class="pagina-atual" href="contato.html">Contato</a>
    </nav>


    <main>
        <section>
            <h2>Entre em contato</h2>
            <p>Este formulário é demonstrativo. Use apenas dados fictícios.</p>


            <form action="#" method="get">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>


                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>


                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="cardapio">Cardápio</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outro">Outro</option>
                </select>


                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>


                <button type="submit">Enviar mensagem</button>
            </form>


            <p class="aviso-formulario">
                Formulário de treinamento: nenhuma mensagem será enviada.
            </p>
           
        </section>
    </main>

    <footer>
        <p>Café & Código — Projeto didático de HTML e CSS | 2026</p>
    </footer>
 
</body>
